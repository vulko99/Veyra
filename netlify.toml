# Netlify config — deploys ONLY the Next.js frontend (for showing the UI to a
# partner). The Django backend is hosted separately.
#
# The marketing/design pages (home, how-it-works, faq, responsible-borrowing,
# loans, about, ...) are client-rendered and need no backend, so they render
# fully on Netlify. The /apply and /results flows call the API and will only
# work once a backend URL is wired in (see API_PROXY_TARGET below).
#
# How to deploy:
#   1. Push this file (it's on your branch).
#   2. app.netlify.com  ->  Add new site  ->  Import from Git  ->  pick this
#      repo/branch. Netlify reads this file; no manual settings needed.
#   3. (Optional) Once your backend is live, set API_PROXY_TARGET in
#      Site settings -> Environment variables to your backend origin
#      (e.g. https://your-backend.example.com) so /api/* is proxied to it.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

  # Omit rows whose regulated value is not supplied yet, instead of rendering
  # the loud red [[TODO:*]] marker in their place. Without this the deploy
  # shows ten of them on /about alone, which is noise on a link sent to a
  # prospective partner.
  #
  # This changes presentation only. No figure is substituted for a missing
  # one, `npm run check:legal` still reports every outstanding value, the
  # disclosures panel keeps its line saying the mandatory values are still to
  # be published, and companyJsonLdFields() still omits unfilled identifiers
  # rather than publishing placeholder ones.
  #
  # It does NOT weaken the guard: `prebuild` runs
  # scripts/check-legal-values.mjs, which exits 1 on a production deploy
  # (CONTEXT === "production") while any blocking value is unfilled. What this
  # flag renders has no bearing on that.
  #
  # That guard is, however, overridden immediately below — see the note there.
  NEXT_PUBLIC_HIDE_UNFILLED = "true"

  # ---------------------------------------------------------------------
  # OVERRIDE — this is the only thing standing between an unfinished legal
  # configuration and a public URL. Read before touching.
  # ---------------------------------------------------------------------
  #
  # Netlify sets CONTEXT=production on production deploys, so
  # check-legal-values.mjs refuses the build while any regulated value is
  # unfilled — 16 of them are: ЕИК, seat address, contact phone, and the
  # representative-example figures. That refusal is why production served a
  # months-old build: Deploy Previews are not CONTEXT=production, so they built
  # happily while every production build failed at prebuild.
  #
  # Set to "false" deliberately, so the current site is visible at its public
  # URL. It does not invent anything: no figure is substituted for a missing
  # one, `npm run check:legal` still reports all 16 outstanding, the
  # disclosures panel still states that the mandatory values are yet to be
  # published, and companyJsonLdFields() still omits unfilled identifiers.
  #
  # What it DOES mean: a publicly reachable, indexable Bulgarian consumer-credit
  # site whose mandatory ЗПК disclosures are incomplete. The application funnel
  # stays closed (NEXT_PUBLIC_PRELAUNCH is unset here, and defaults to closed),
  # so no personal data is collected — that is a separate switch and it is off.
  #
  # REMOVE THIS LINE once the company values are supplied. It is not a setting
  # to leave in place; it is a hold-open while the entity is registered.
  REQUIRE_LEGAL_VALUES = "false"

# Official Next.js runtime: handles SSR/routing for the App Router on Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Custom domain
# ---------------------------------------------------------------------------
# A *.netlify.app subdomain damages trust, search ranking and financial-ads
# review at the same time. Moving to a custom domain (ideally .bg) is a config
# change only — no code change — because every absolute URL derives from a
# single value (frontend/lib/seo.ts -> SITE_URL).
#
# To migrate:
#   1. Netlify -> Domain management -> add the domain and set it as PRIMARY.
#      Netlify then issues the certificate and 301s the .netlify.app subdomain
#      to the primary domain automatically. That covers the redirect
#      requirement on its own; the block below is only needed for an apex/www
#      preference Netlify does not already handle.
#   2. Set NEXT_PUBLIC_SITE_URL to the new origin (e.g. https://veyra.bg) in
#      Site settings -> Environment variables, then redeploy. Canonical tags,
#      OG URLs, sitemap.xml and robots.txt all follow from it.
#      Until it is set, the build falls back to Netlify's own URL, so a preview
#      deploy never claims to be the production domain.
#   3. Add the new origin to the backend's CORS/ALLOWED_HOSTS.
#   4. Re-verify Google Search Console and Bing Webmaster Tools for the new
#      domain, and resubmit the sitemap.
#
# The target domain is NOT hardcoded anywhere. Fill it in here only once it is
# confirmed (TODO-LEGAL.md §7), then uncomment:
#
# [[redirects]]
#   from = "https://veyramarket.netlify.app/*"
#   to = "https://REPLACE-WITH-CONFIRMED-DOMAIN/:splat"
#   status = 301
#   force = true
#
# NOTE: do NOT add a SPA catch-all redirect (`from = "/*"` -> `/index.html`).
# It would swallow /robots.txt and /sitemap.xml, which are generated as real
# prerendered files by app/robots.ts and app/sitemap.ts. There is no such
# catch-all in this config, and there must not be one.
